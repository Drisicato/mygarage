# Builds this fork's own Docker image on every push to main and publishes it
# to GitHub's container registry as ghcr.io/<owner>/mygarage:latest (plus a
# sha-<commit> tag). The upstream Publish workflow only runs on version tags
# and pushes to homelabforge/mygarage, so a fork needs its own.
#
# Skipped on the upstream repository itself.
name: Fork image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-image
  cancel-in-progress: true

jobs:
  image:
    if: github.repository_owner != 'homelabforge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image names must be lower case; metadata-action lowercases the owner.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mygarage
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Add linux/arm64 here for a Raspberry Pi or other ARM host (slower build).
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
