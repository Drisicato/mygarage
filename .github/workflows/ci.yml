name: CI

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    uses: homelabforge/shared-workflows/.github/workflows/python-react-ci.yml@v1.6.0-rc1
    with:
      enable-translations: true
      enable-pg-migrations: true
      # Closes #77: run both migration and integration tests against the PG
      # sidecar so the asyncpg loop-binding regression that gated this work
      # can't reappear. Pytest accepts multiple positional paths.
      # pg_migration_path_test.py doesn't match python_files, so it's named
      # outright. It drops the public schema, so it runs before integration
      # builds its session schema, same as tests/migrations/.
      pg-migrations-pytest-path: "tests/migrations/ tests/pg_migration_path_test.py tests/integration/"
      security-tripwire-script: .github/scripts/security-tripwire.sh
